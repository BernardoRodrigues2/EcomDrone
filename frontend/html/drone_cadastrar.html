<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/drone_cadastrar.js" defer></script>
    <title>Cadastro de Drone</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Drone</h1>
        <form>
            <label for="modelo">Modelo</label><br>
            <input type="text" id="modelo" required><br><br>

            <label for="marca">Marca </label><br>
            <input type="text" id="marca" required><br><br>

            <label for="numSerie">numSerie</label><br>
            <input type="number" id="numSerie" required><br><br>
            
            <label for="tipo">Tipo </label><br>
            <input type="text" id="tipo" required><br><br>

            <label for="idCliente">Código do Cliente (Dono)</label><br>
            <input type="number" id="idCliente" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
